server {
    listen 0.0.0.0:8083;
    root ./www;
    index index.html;

    location / {
        allow_methods GET;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allow_methods GET POST;
        client_max_body_size 200M;
        cgi_extension .bla /home/tuzan/Desktop/webserv/cgi_tester;
		cgi_extension .py /usr/bin/python3;
    }
}
