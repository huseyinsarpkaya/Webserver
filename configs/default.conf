# ==============================================================================
# WEBSERV - EXAMPLE CONFIGURATION FILE (default.conf)
# ==============================================================================
# This file shows ALL the features required by the subject (IV.3 Configuration
# file) using concrete location/server blocks. It uses a syntax inspired by
# NGINX's 'server' block.
#
# Run:  ./webserv configs/default.conf
# (If you run it with no arguments, this file is used by default.)
#
#   Static site (GET)            curl http://127.0.0.1:8080/index.html
#   Directory -> index file      curl http://127.0.0.1:8080/
#   HTTP redirection (301)       curl -i http://127.0.0.1:8080/old
#   File upload (POST)           curl -X POST --data hi http://127.0.0.1:8080/uploads/test.txt
#   File delete (DELETE)         curl -X DELETE http://127.0.0.1:8080/uploads/test.txt
#   Method not allowed (405)     curl -X DELETE http://127.0.0.1:8080/index.html
#   client_max_body_size (413)   the /uploads location has a 20M limit -- a bigger body returns 413
#   CGI (GET)                    curl http://127.0.0.1:8080/cgi-bin/hello.py
#   CGI (POST)                   curl -X POST --data a=1 http://127.0.0.1:8080/cgi-bin/hello.py
#   Custom error page (404)      curl -i http://127.0.0.1:9091/missing-page
#   Autoindex (directory list)   curl http://127.0.0.1:9091/
#   Wildcard/specific merge      curl -H 'Host: api_local' http://127.0.0.1:9090/
#                                 curl -H 'Host: api_public' http://<machine-ip>:9090/
#   Listening on multiple ports   8080 (main_site), 9090 (api_local/api_public), 9091 (admin_panel)
#   Keep-alive                    curl -v http://127.0.0.1:8080/ http://127.0.0.1:8080/style.css 2>&1 | grep 'Re-using'
#
# ------------------------------------------------------------------------------
# SYNTAX SUMMARY
# ------------------------------------------------------------------------------
#   server { ... }            Opens a server block (defines a "website").
#                             Multiple servers can listen on the same ip:port.
#   location /path { ... }    Inside a server, defines rules for a specific URL
#                             prefix. The longest matching location wins
#                             (e.g. if /kapouet/x matches both "/" and
#                             "/kapouet", "/kapouet" is chosen).
#   Blocks end with '{' '}', directives end with ';'. Lines starting with '#'
#   are comments.
#
# ------------------------------------------------------------------------------
# SERVER DIRECTIVES (and their defaults)
# ------------------------------------------------------------------------------
#   listen <ip:port | port>          Default: 0.0.0.0:8080
#   server_name <name>               Default: "" (used when no server_name
#                                     matches the Host header)
#   root <dir>                       Default: ./www
#   index <file...>                  Default: index.html
#   autoindex on|off                 Default: off  (directory listing)
#   client_max_body_size <num><K|M|G>  Default: 1M
#   error_page <code...> <page>       Default: none (built-in error page)
#
# ------------------------------------------------------------------------------
# LOCATION DIRECTIVES (can be inherited from server: root/index/autoindex/
# client_max_body_size -- if a location defines its own value, it overrides
# the server's value)
# ------------------------------------------------------------------------------
#   allow_methods GET POST DELETE     Default: GET
#   return <code> <target>            HTTP redirection (301/302/303/307/308)
#   upload_dir <dir>                  Where files uploaded with POST are saved
#   cgi_extension <.ext> <interpreter>   Run files with this extension as CGI
#
# ==============================================================================


# ------------------------------------------------------------------------------
# SCENARIO 1 -- Main site: static website + all subject features (port 8080)
# ------------------------------------------------------------------------------
server {
	listen 0.0.0.0:8080;
	server_name main_site;

	# Default values for ALL locations in this server (inherited):
	root ./www;
	index index.html;
	client_max_body_size 1M;
	autoindex off;

	# --- Default error pages (subject: "default error pages") ---
	error_page 404 /errors/404.html;
	error_page 500 502 503 /errors/50x.html;

	# --- Static site: "/" -> ./www/index.html (subject: "serve a fully static website") ---
	location / {
		allow_methods GET;
	}

	# --- root example, exactly the same as the subject's OWN example:
	# if "/kapouet" -> "/tmp/www", then "/kapouet/pouic/toto/pouet" looks for
	# "/tmp/www/pouic/toto/pouet". Here we use our own project's
	# ./www/kapouet folder instead of /tmp/www.
	location /kapouet {
		root ./www/kapouet;
		allow_methods GET;
	}

	# --- Directory listing enabled (subject: "enabling or disabling directory
	# listing") + the "default file to serve when the requested resource is a
	# directory" feature already applies to "/" through index; here we show
	# autoindex in a SEPARATE location to make it concrete: ---
	location /gallery {
		root ./www/gallery;
		autoindex on;
	}

	# --- HTTP redirection (subject: "HTTP redirection") ---
	location /old {
		return 301 /index.html;
	}

	# --- File upload (subject: "clients must be able to upload files",
	# "storage location is provided") + example of a method restriction ---
	location /uploads {
		allow_methods GET POST DELETE;
		root ./www/uploads;
		upload_dir ./www/uploads;
		client_max_body_size 20M;
		autoindex on;
	}

	# --- Running CGI based on file extension (subject: "Execution of CGI, based
	# on file extension") ---
	location /cgi-bin {
		allow_methods GET POST;
		root ./www/cgi-bin;
		cgi_extension .py /usr/bin/python3;
		cgi_extension .js /usr/bin/node;

	}
}


# ------------------------------------------------------------------------------
# SCENARIO 2 -- A second port (subject: "listen to multiple ports to deliver
# different content"). A fully independent second "website" with its own
# root and its own error pages.
# ------------------------------------------------------------------------------
server {
	listen 0.0.0.0:8081;
	server_name second_site;

	root ./www/second_site;
	index index.html;
	client_max_body_size 5M;

	location / {
		allow_methods GET;
	}
}
